---
name: Review changes on Dev (Commits/PRs)
permissions:
  contents: read
on:
  push:
    branches: ["dev"]
  pull_request:

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18

      - uses: actions/checkout@v4

      - name: "Cache node_modules"
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v18-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v18-

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: run unit tests
        run: npm run test-local

      - name: Validate repository
        run: npm run validate-repository

  integration-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run integration tests
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_ASSERTION: ${{ secrets.CLIENT_ASSERTION }}
          DEBIT_ACCOUNT_NUMBER: ${{ secrets.DEBIT_ACCOUNT_NUMBER }}
          CLIENT_ACCOUNT_ID: ${{ secrets.CLIENT_ACCOUNT_ID }}
        run: npm run test-workflow
