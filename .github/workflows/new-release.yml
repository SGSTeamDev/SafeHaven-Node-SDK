---
name: Publish new release to npmjs
permissions:
  contents: read
on:
  release:
    types: [created]

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Install Dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
        run: npm run validate-release

      - name: Verify package
        run: npm run verify

      - name: Run integration tests
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_ASSERTION: ${{ secrets.CLIENT_ASSERTION }}
          DEBIT_ACCOUNT_NUMBER: ${{ secrets.DEBIT_ACCOUNT_NUMBER }}
          CLIENT_ACCOUNT_ID: ${{ secrets.CLIENT_ACCOUNT_ID }}
        run: npm run test-workflow

      - name: Check package contents
        run: npm pack --dry-run

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node Engine
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/

      - name: Install staged publishing CLI
        run: npm install --global npm@11.15.0

      - name: Install Node dependencies
        run: npm ci

      - name: Stage package for npm approval
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
